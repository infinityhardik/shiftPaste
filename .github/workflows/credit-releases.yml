name: Credit releases

# One-off: add the "Developed by" credit to the notes of the existing
# releases. Runs only on this working branch; v2.0.1 stays the latest.
on:
  push:
    branches: [claude/epic-pascal-1y1z8x]
    paths: [.github/workflows/credit-releases.yml]

permissions:
  contents: write

jobs:
  credit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CREDIT: "**Developed by:** [InfinityHardik](https://github.com/infinityhardik) + Claude"
    steps:
      - name: Add the credit line to each release's notes
        run: |
          for tag in v1.1.0 v2.0.0 v2.0.1; do
            gh release view "$tag" --json body -q .body > body.md
            if grep -qF "Developed by" body.md; then echo "$tag: already credited"; continue; fi
            printf '\n%s\n' "$CREDIT" >> body.md
            if [ "$tag" = v2.0.1 ]; then latest=--latest; else latest=--latest=false; fi
            gh release edit "$tag" --notes-file body.md "$latest"
            echo "$tag: credited"
          done
      - name: Result
        run: |
          for tag in v1.1.0 v2.0.0 v2.0.1; do
            echo "== $tag"
            gh release view "$tag" --json body -q .body | tail -n 2
          done
