name: Release

# Push a tag like v2.0.0 (or run manually) to build every download and attach
# them to a GitHub Release: a draft to review before publishing, unless a
# manual run unticks "draft". The version must match Cargo.toml, so a build is
# never labelled with another version. Release notes: the version's own
# .github/release-notes/<version>.md (if any), then downloads.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 2.0.0 (must match Cargo.toml)"
        required: true
      draft:
        description: "Create a draft (publish it yourself after checking)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The version matches Cargo.toml
        run: |
          want="${{ github.event.inputs.version || github.ref_name }}"
          want="${want#v}"
          have="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "release: $want, Cargo.toml: $have"
          if [ "$want" != "$have" ]; then
            echo "::error::Release version $want doesn't match the app's version $have in Cargo.toml. Bump Cargo.toml first, or release $have."
            exit 1
          fi

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: echo "VERSION=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release -p shiftpaste
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsis = "${env:ProgramFiles(x86)}\NSIS"
            if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
            Add-Content $env:GITHUB_PATH $nsis
          }
      - name: Installer (NSIS, admin prompt)
        shell: bash
        run: |
          makensis -DVERSION="$VERSION" -DSRCDIR="..\\..\\target\\release" packaging/windows/shiftpaste.nsi
          mkdir -p dist-out && mv packaging/windows/ShiftPaste-*-Setup.exe dist-out/
      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "ShiftPaste-$env:VERSION-portable"
          New-Item -ItemType Directory -Force "$dir/ShiftPaste-data" | Out-Null
          Copy-Item target/release/shiftpaste.exe $dir/
          Copy-Item packaging/windows/PORTABLE-README.txt $dir/README.txt
          Copy-Item packaging/windows/PORTABLE-README.txt "$dir/ShiftPaste-data/README.txt"
          Compress-Archive -Path $dir -DestinationPath "dist-out/$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-out/*

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: echo "VERSION=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_ENV"
      - name: App bundle + dmg (universal)
        run: packaging/macos/build-dmg.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/macos/*.dmg

  linux:
    needs: check
    # Oldest supported runner = widest glibc compatibility for the AppImage.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libfuse2
      - name: Version
        run: echo "VERSION=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_ENV"
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # runners may lack FUSE
        run: |
          curl -sSfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL=./appimagetool packaging/linux/build-appimage.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/appimage/*.AppImage

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          v="${v#v}"
          {
            if [ -f ".github/release-notes/$v.md" ]; then cat ".github/release-notes/$v.md"; echo; fi
            cat .github/release-notes/downloads.md
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          target_commitish: ${{ github.sha }}
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Shift Paste ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: artifacts/*
          body_path: ${{ runner.temp }}/release-notes.md
