name: Release

# Push a tag like v2.0.0 (or run manually) to build every download and attach
# them to a *draft* GitHub Release for review before publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 2.0.0"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: echo "VERSION=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release -p shiftpaste
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsis = "${env:ProgramFiles(x86)}\NSIS"
            if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
            Add-Content $env:GITHUB_PATH $nsis
          }
      - name: Installer (NSIS, admin prompt)
        shell: bash
        run: |
          makensis -DVERSION="$VERSION" -DSRCDIR="..\\..\\target\\release" packaging/windows/shiftpaste.nsi
          mkdir -p dist-out && mv packaging/windows/ShiftPaste-*-Setup.exe dist-out/
      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "ShiftPaste-$env:VERSION-portable"
          New-Item -ItemType Directory -Force "$dir/ShiftPaste-data" | Out-Null
          Copy-Item target/release/shiftpaste.exe $dir/
          Copy-Item packaging/windows/PORTABLE-README.txt $dir/README.txt
          Copy-Item packaging/windows/PORTABLE-README.txt "$dir/ShiftPaste-data/README.txt"
          Compress-Archive -Path $dir -DestinationPath "dist-out/$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-out/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: echo "VERSION=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_ENV"
      - name: App bundle + dmg (universal)
        run: packaging/macos/build-dmg.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/macos/*.dmg

  linux:
    # Oldest supported runner = widest glibc compatibility for the AppImage.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libfuse2
      - name: Version
        run: echo "VERSION=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_ENV"
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # runners may lack FUSE
        run: |
          curl -sSfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL=./appimagetool packaging/linux/build-appimage.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/appimage/*.AppImage

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          target_commitish: ${{ github.sha }}
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Shift Paste ${{ github.event.inputs.version || github.ref_name }}
          files: artifacts/*
          body: |
            Shift Paste 2.0 is a rewrite in Rust: it uses a fraction of 1.x's memory and now runs on Windows, macOS and Linux.

            **What's new**
            - Fast, typo-forgiving search across clipboard history and your snippet collections (`@collection`, `#tag`).
            - Built-in editor with undo/redo, favorites (★), drag or Alt+↑/↓ to reorder.
            - Excel and CSV import (one click, or a wizard with column mapping) and export.
            - Paste your way: plain text (⇧ Enter), case and line transforms (Alt Enter), several items at once.
            - Privacy: 100% offline, skips password-manager copies, per-app lists for recording and the shortcut.
            - Windows: the app you paste into keeps its size and maximized state; the uninstaller can remove all data.

            **Downloads**
            - **Windows:** `ShiftPaste-…-Setup.exe` (installs for all users; asks for admin) or the portable zip (keeps its data next to the program). The files aren't code-signed, so Windows may say "Windows protected your PC": click *More info → Run anyway*.
            - **macOS:** open the `.dmg` and drag Shift Paste to Applications. It isn't notarized: the first time, right-click the app → Open. Then allow it under System Settings → Privacy & Security → Accessibility so it can paste for you.
            - **Linux:** make the AppImage executable and run it (needs GTK 3; X11 fully supported, Wayland with some limits).

            Shift Paste 1.x data isn't imported automatically; 1.x is still available from the [v1.1.0 release](https://github.com/infinityhardik/shiftPaste/releases/tag/Final).
