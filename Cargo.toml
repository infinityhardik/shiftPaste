[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/app"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "MIT"
authors = ["InfinityHardik"]
repository = "https://github.com/infinityhardik/shiftPaste"
rust-version = "1.92"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Line numbers for backtraces, without full debug info: far smaller and
# faster builds.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
