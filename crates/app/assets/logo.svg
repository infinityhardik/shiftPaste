<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Shift Paste</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <!-- A sheet behind the board: the history stack -->
  <rect x="150" y="128" width="252" height="300" rx="42" fill="#FFFFFF" opacity="0.28"/>
  <!-- Clipboard board -->
  <rect x="110" y="150" width="272" height="306" rx="44" fill="#FFFFFF"/>
  <!-- Text lines on the board -->
  <rect x="158" y="300" width="176" height="28" rx="14" fill="#C7D7FE"/>
  <rect x="158" y="356" width="118" height="28" rx="14" fill="#C7D7FE"/>
  <!-- Shift arrow rising out of the board, in place of the clip -->
  <path d="M246 64 L344 174 L296 174 L296 240 L196 240 L196 174 L148 174 Z" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linejoin="round"/>
  <path d="M246 64 L344 174 L296 174 L296 240 L196 240 L196 174 L148 174 Z"
        fill="#FFFFFF" stroke="url(#arrow)" stroke-width="26" stroke-linejoin="round"/>
</svg>
